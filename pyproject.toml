[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minority-estimation"
version = "0.1.0"
description = "Stimulus preparation pipeline for the Minority Estimation study"
requires-python = ">=3.10,<3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
